<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <h1>Stash</h1>
      <button id="mode-btn" class="mode-btn" type="button" title="Add to your Stash" aria-label="Add to your Stash">
        <svg class="icon-add" width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="10" fill="#4CAF50"/>
          <path d="M11 6 V16 M6 11 H16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="icon-back" width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="9" cy="9" r="5.5" stroke="#e0e0e0" stroke-width="1.8" fill="none"/>
          <path d="M13.2 13.2 L17.5 17.5" stroke="#e0e0e0" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Stash View -->
    <div id="stash-view" class="hidden">
      <div id="status"></div>

      <div id="url-preview">
        <span id="page-title"></span>
        <span id="page-url"></span>
      </div>

      <div id="snippet-preview" class="hidden">
        <label>Selected Text</label>
        <div id="snippet-text"></div>
      </div>

      <div class="field tag-field">
        <label for="tags">Tags</label>
        <input type="text" id="tags" placeholder="comma-separated" autocomplete="off">
        <div id="tag-dropdown" class="tag-dropdown hidden"></div>
      </div>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="2" placeholder="optional"></textarea>
      </div>

      <div class="field">
        <label for="collection">Collection</label>
        <select id="collection">
          <option value="">None</option>
        </select>
      </div>

      <div id="actions">
        <button id="stash-btn" class="primary">Stash It</button>
      </div>

      <div id="message"></div>
    </div>

    <!-- Search View -->
    <div id="search-view">
      <div class="field search-field">
        <input type="text" id="search-input" placeholder="Search your stash... (tag:name to filter)" autocomplete="off">
        <span id="search-clear" class="search-clear hidden">&times;</span>
        <div id="search-tag-dropdown" class="tag-dropdown hidden"></div>
      </div>
      <div id="tag-cloud"></div>
      <div id="search-results"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
