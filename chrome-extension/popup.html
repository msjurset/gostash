<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <h1>Stash</h1>
      <button id="view-toggle" class="view-toggle" type="button" title="Show recent" aria-label="Cycle browse view">
        <!-- Three icons, one visible at a time based on current view.
             Cycles: cloud → recent → frequent → cloud.
             Tooltip shows the NEXT view it will switch to. -->
        <svg class="view-icon view-icon-cloud" width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M5.5 14 A3.5 3.5 0 0 1 5.5 7 A4 4 0 0 1 13 6 A3 3 0 0 1 16 13 Z" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <svg class="view-icon view-icon-recent" width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="10" cy="10" r="7" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
          <path d="M10 5.5 V10 L13 12" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg class="view-icon view-icon-frequent" width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="3"  y="11" width="3" height="5" fill="#e0e0e0"/>
          <rect x="8.5" y="7"  width="3" height="9" fill="#e0e0e0"/>
          <rect x="14"  y="9"  width="3" height="7" fill="#e0e0e0"/>
        </svg>
      </button>
      <button id="mode-btn" class="mode-btn" type="button" title="Add to your Stash" aria-label="Add to your Stash">
        <svg class="icon-add" width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="10" fill="#4CAF50"/>
          <path d="M11 6 V16 M6 11 H16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="icon-back" width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="9" cy="9" r="5.5" stroke="#e0e0e0" stroke-width="1.8" fill="none"/>
          <path d="M13.2 13.2 L17.5 17.5" stroke="#e0e0e0" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Download routing toggles — top-level so they're visible in
         both Stash AND Search views. Only rendered when the current
         tab's host matches one of the rules configured in
         options.html. Lets the user pre-emptively pause routing
         before a "I don't want this one stashed" download, then
         re-enable when they're done. Background.js picks up the
         toggle change via storage.onChanged with no reload. -->
    <div id="routing-section" class="routing-section hidden">
      <label class="routing-label">Download routing</label>
      <div id="routing-list"></div>
    </div>

    <!-- Stash View -->
    <div id="stash-view" class="hidden">
      <div id="status"></div>

      <div id="url-preview">
        <span id="page-title"></span>
        <span id="page-url"></span>
      </div>

      <div id="snippet-preview" class="hidden">
        <label>Selected Text</label>
        <div id="snippet-text"></div>
      </div>

      <div class="field tag-field">
        <label for="tags">Tags</label>
        <input type="text" id="tags" placeholder="comma-separated" autocomplete="off">
        <div id="tag-dropdown" class="tag-dropdown hidden"></div>
      </div>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="2" placeholder="optional"></textarea>
      </div>

      <div class="field">
        <label for="collection">Collection</label>
        <select id="collection">
          <option value="">None</option>
        </select>
      </div>

      <div id="actions">
        <button id="stash-btn" class="primary">Stash It</button>
      </div>

      <div id="message"></div>
    </div>

    <!-- Search View -->
    <div id="search-view">
      <div class="field search-field">
        <input type="text" id="search-input" placeholder="Search your stash... (tag:name to filter)" autocomplete="off">
        <span id="search-clear" class="search-clear hidden">&times;</span>
        <div id="search-tag-dropdown" class="tag-dropdown hidden"></div>
      </div>
      <div id="tag-cloud"></div>
      <div id="recent-list" class="history-list hidden"></div>
      <div id="frequent-list" class="history-list hidden"></div>
      <div id="search-results"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
